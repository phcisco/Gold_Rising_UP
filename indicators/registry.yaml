# 指标注册表 v1（第 1 阶段种子集）。
# 级别 tier：1 常驻体制仪表 | 2 叙事证据 | 3 背景与观察池 | target 交易标的监控。
# gold_sign：该指标上行对金价的经典方向，+1 利多 / -1 利空 / 0 不定或本身即金价；供热力图与背离规则使用，体制依赖由叙事卡处理。
# collect: false 表示尚未接入（stage 标注计划阶段），注册表保留条目以便后续只改配置。
# 数据质量规则见 docs/design/dashboard-design.md 3.2 节：只取官方或一手来源，每个数据点带出处与滞后。
version: 1
groups:
  - {id: price, name: 黄金价格基准, order: 0, question: 金价本身在哪里，以什么口径}
  - {id: opportunity_cost, name: 机会成本与政策路径, order: 1, question: 持有黄金的代价在升还是降}
  - {id: inflation, name: 通胀与联储资产负债表, order: 2, question: 通胀是否被定价为暂时，联储在扩表还是缩表}
  - {id: dollar_credit, name: 美元信用, order: 3, question: 是黄金强，还是美元弱}
  - {id: risk_tail, name: 避险与尾部, order: 4, question: 市场在为哪种风险定价}
  - {id: flows_positioning, name: 资金与持仓, order: 5, question: 谁在买，有多拥挤}
  - {id: physical_east, name: 实物与东方需求, order: 6, question: 底部的结构性买盘还在不在}
  - {id: internals, name: 市场内部结构, order: 7, question: 市场自己在怎么投票}
  - {id: miners, name: 标的监控组（矿业股与 ETF）, order: 8, question: 交易标的相对金价的表现}

indicators:
  # ---------------- 黄金价格基准 ----------------
  - id: gc_front
    name: COMEX 黄金近月连续（Yahoo GC=F）
    group: price
    tier: "3"
    unit: usd
    decimals: 1
    frequency: daily
    lag_days: 0
    gold_sign: 0
    source: {provider: yahoo, symbol: "GC=F", publisher: CME Group 经 Yahoo Finance 分发, url: "https://finance.yahoo.com/quote/GC%3DF"}
    note: Yahoo 连续序列按到期最近合约拼接，含交割月冷门合约，历史报价系统性低于活跃合约；仅作长历史参考

  - id: gold_nav_implied
    name: GLD 官方 NAV 隐含金价（≈ LBMA 下午定盘）
    group: price
    tier: "1"
    unit: usd
    decimals: 1
    frequency: daily
    lag_days: 1
    gold_sign: 0
    source: {provider: spdr, series: nav_implied_gold, publisher: SPDR Gold Trust（State Street）, url: "https://www.spdrgoldshares.com/usa/historical-data/"}
    note: 由官方 NAV/份 除以 每份含金盎司 推算，等于当日 LBMA 定盘价扣除极小信托费用

  - id: gld_close
    name: GLD 收盘价
    group: price
    tier: target
    unit: usd
    decimals: 2
    frequency: daily
    lag_days: 1
    gold_sign: 0
    source: {provider: spdr, series: close, publisher: SPDR Gold Trust（State Street）, url: "https://www.spdrgoldshares.com/usa/historical-data/"}

  - id: eurusd
    name: 欧元兑美元
    group: dollar_credit
    tier: "2"
    unit: ratio
    decimals: 4
    frequency: daily
    lag_days: 0
    gold_sign: 1
    source: {provider: yahoo, symbol: "EURUSD=X", publisher: Yahoo Finance, url: "https://finance.yahoo.com/quote/EURUSD%3DX"}

  - id: usdjpy
    name: 美元兑日元
    group: dollar_credit
    tier: "2"
    unit: ratio
    decimals: 2
    frequency: daily
    lag_days: 0
    gold_sign: 0
    source: {provider: yahoo, symbol: "JPY=X", publisher: Yahoo Finance, url: "https://finance.yahoo.com/quote/JPY%3DX"}

  - id: usdcny
    name: 美元兑人民币（在岸）
    group: dollar_credit
    tier: "2"
    unit: ratio
    decimals: 4
    frequency: daily
    lag_days: 0
    gold_sign: 0
    source: {provider: yahoo, symbol: "CNY=X", publisher: Yahoo Finance, url: "https://finance.yahoo.com/quote/CNY%3DX"}
    note: Yahoo 的离岸 CNH=X 无历史数据，改用在岸 CNY=X

  - id: xau_eur
    name: 欧元计价金价
    group: price
    tier: "2"
    unit: index
    decimals: 0
    frequency: daily
    lag_days: 0
    gold_sign: 0
