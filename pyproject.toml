[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldrising"
version = "0.1.0"
description = "黄金大作手仪表盘：跨资产黄金叙事监控"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "requests>=2.31",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "mypy>=1.10",
  "ruff>=0.5",
  "pandas-stubs",
  "types-requests",
  "types-PyYAML",
  "types-openpyxl",
]

[project.scripts]
gold = "goldrising.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "W"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/goldrising/render/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["goldrising"]
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=goldrising.compute --cov=goldrising.contracts --cov=goldrising.rules --cov-report=term-missing --cov-fail-under=40"

[tool.coverage.run]
source = ["src/goldrising"]
