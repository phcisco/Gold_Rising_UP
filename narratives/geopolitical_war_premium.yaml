tensions:
- narrative_id: energy_stagflation
  note: 同一事件的宏观侧面
- narrative_id: risk_on_bear_case
  note: 冲突升级会打断风险偏好，但在体制 B 下通过加息路径反而强化看空叙事的机会成本腿
news_queries:
- Strait of Hormuz tanker transits
- Iran ceasefire talks blockade
- Israel Iran strike escalation
- oil price Middle East conflict gold
- OVX oil volatility index
counterargument: 2026 年黄金完全没有表现为战争对冲：它在战争开始前一个月见顶，在战争期间下跌 25%，GPR 与金价的同期相关为负。 “战争溢价”是原油叙事，黄金只是通过联储反应函数被间接影响。此外 GPR 30 日均值 137 只有 77 分位， 显示“战争疲劳”——市场对同一冲突的边际反应在衰减，除非事件性质升级（美国直接入侵，赔率 15.5%）。
