id: geopolitical_war_premium
name: 地缘政治与战争溢价：用可观察指标而非新闻情绪跟踪
status: active
lifecycle_state: 主导
lifecycle_since: 2026-03-02
lifecycle_rationale: 美伊冲突自 2026 年 3 月初起：Caldara–Iacoviello 地缘政治风险日指数（GPRD）3 月 2 日 501 为年内峰值，3 月均值 325 （2022 年全年均值 153）；EIA 8 月 STEO 假设霍尔木兹“持续严重受限”至 8 月并预计约 60 万桶/日中断延续至 2027 年底。 当前 GPRD 9 月 1 日 201（10 年 92 分位），30 日均值 137（77 分位）；Cboe OVX 47.77（10 年 81 分位）。 它是宏观层面的主导事件，但对黄金的传导方向取决于体制：2026 年 3 至 6 月黄金在战争期间下跌，因为冲击通过油价与联储加息 而非避险买盘作用于金价。Polymarket 2026-09-03：以色列-伊朗停火维持至 9 月 30 日 85.5%；霍尔木兹 9 月 30 日前恢复正常 2.4%、 12 月 31 日前 28.5%；美国 9 月 30 日前宣布结束对伊封锁 17.5%；美国 2027 年前入侵伊朗 15.5%。
pricing_degree: 充分
pricing_rationale: 原油与波动率市场已充分定价长期受阻：Brent 94 至 96 美元、OVX 81 分位、Polymarket 给年底前恢复正常仅 28.5%。 被低估的是“和平情景”：在联储可信体制下，霍尔木兹恢复导致油价回落与加息预期消退，对黄金反而利多—— 这与直觉相反，是本簇最重要的定价错位候选。黄金自身没有明显的战争溢价：金油比 47（年初 71），GPR 高位时黄金反而下跌。
direction: mixed
horizon: 3-12m
thesis: 战争溢价目前在油不在金；在联储可信体制下，冲突升级通过油价与加息利空黄金、和平通过反向路径利多黄金，应以 GPR、OVX、金油比与预测市场赔率跟踪而非新闻情绪。
logic_chain:
- 冲突升级导致原油供给受限，Brent 与 OVX 上升
- 能源通胀推高整体 CPI 与 PCE，联储在体制 B 下以加息或维持高利率应对
- 实际利率上升压制黄金；避险买盘不足以抵消（2026 年 3 至 6 月实证：Brent +70%，黄金 -25%）
- 体制 A 下联储不加息，油价冲击表现为通胀预期上行与美元走弱，黄金上涨
- 因此对黄金而言，需要同时读取 GPR、OVX、金油比与盈亏平衡，而不是新闻情绪
regime_dependency:
  passive_fed: bull
  credible_fed: bear
  note: 体制决定传导路径。体制 B 下和平是黄金的多头催化剂（油价与加息预期同降），升级是空头催化剂；体制 A 下相反。 判定当前体制的量化签名见 energy_stagflation 卡的 regime_dependency 说明。
evidence_indicators:
- indicator_id: gold_oil_ratio
  expected_sign: up
  weight: high
  rationale: 比值上升表示黄金开始承接冲突溢价；下降表示溢价在油
- indicator_id: dfii10
  expected_sign: down
  weight: high
  rationale: 冲突若通过避险而非加息传导，实际利率应下行
- indicator_id: t10yie
  expected_sign: up
  weight: medium
  rationale: 油价冲击被定价为通胀而非增长风险
- indicator_id: vix
  expected_sign: up
  weight: low
  rationale: 冲突外溢到股票风险；当前 15.2 表明股票未定价冲突
- indicator_id: gc_front
  expected_sign: up
  weight: medium
  rationale: 与 GPR 同向上涨才构成黄金的战争溢价
