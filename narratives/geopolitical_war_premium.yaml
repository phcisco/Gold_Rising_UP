  created: 2026-09-03
  description: 到 2026-12-31，Brent 低于 70 美元且霍尔木兹恢复正常，而黄金同期下跌超过 10%——“体制 B 下和平利多黄金”的传导被证伪
  type: qual
  deadline: 2026-12-31
- id: f2
  version: 1
  created: 2026-09-03
  description: 到 2026-12-31，若冲突升级使 Brent 高于 110 美元，而黄金同期下跌超过 10% 且 10 年实际收益率不升——避险与利率两条路径都失效，黄金对该事件无系统性反应，叙事归档
  type: qual
