id: real_rate_anchor_regime_switch
name: 实际利率旧锚回归与体制 A/B 切换
status: active
lifecycle_state: 主导
lifecycle_since: 2026-08-28
lifecycle_rationale: 2026 年 6 月 17 日 FOMC 声明以 12-0 写入"The Committee will deliver price stability"，7 月 29 日三位地区行长（Hammack、Kashkari、Logan）异议主张加息 25bp， 8 月 28 日主席 Warsh 在 Jackson Hole 称"65 个月持续高通胀的责任完全在央行"。财政部曲线显示 10Y TIPS 实际收益率从 2 月 27 日 1.72% 升至 9 月 2 日 2.45% （7 月 31 日 2.47% 为年内高点），同期 10Y 盈亏平衡稳定在 2.3% 附近；黄金主力合约自 1 月 29 日 5318 美元峰值跌至 9 月 3 日 4476 美元（约 -16%）。 纽约联储 ACM 分解显示 2026 年 10Y 收益率上行几乎全部来自风险中性利率（1 月 2 日 3.48% → 9 月 1 日 4.08%），期限溢价基本不变（0.80 → 0.78）， 即市场在为"联储主动"而非"财政贬值"定价。实际利率与金价的负相关已重新成为主导定价逻辑。
pricing_degree: 部分
pricing_rationale: 价格已反映一部分：金价自峰值回撤约 16%，8 月 28 日单日 -2.9%（GC=F 收盘 4609.7 → 4478.1）。但持仓尚未出清：CFTC 管理基金黄金净多头 2026-08-25 为 144,747 张， 为 2026 年高点、近五年第 78.5 百分位（且该数据截止于 Warsh 讲话前）；SPDR GLD 持仓 9 月 2 日 1056.62 吨，比 20 个交易日前（8 月 5 日 1014.15 吨）增加约 42 吨， 下跌途中仍在流入（但仍低于 2 月 27 日 1101.33 吨的年内高点，高于 7 月 17 日 999.02 吨的低点）。这说明"实际利率压制金价"的下行尚未被多头充分接受，仍有拥挤度需要释放。
direction: bear
horizon: 3-12m
thesis: 只要联储保持主动且可信（体制 B），10Y 实际收益率就是金价主锚，实际利率上行压制金价；体制切换的开关握在联储对通胀的反应函数手中。
logic_chain:
- 通胀（CPI 7 月 3.36%，PCE 12 个月 3.7%）高于目标，联储在声明中承诺"deliver price stability"并有三票主张加息
- 市场把名义收益率上行全部归因于实际利率与政策路径，盈亏平衡通胀稳定甚至回落
- 实际收益率是持有黄金的机会成本，实际收益率升至 2.4% 以上使无息资产相对吸引力下降
- 金价按旧范式跟随实际利率反向运动；黄金对"主权信用溢价"的定价被暂时关闭
- 若联储在通胀高于 3% 时转向宽松或屈从压力，市场将切回体制 A，实际利率与金价脱钩
regime_dependency:
  passive_fed: bull
  credible_fed: bear
  note: 体制 B（当前）：实际利率上行即金价下行，负相关成立。体制 A（联储被动、财政主导）：实际利率被压低或被市场视为"不可信的低"， 金价按期限溢价、通胀风险溢价与主权信用定价，实际利率与金价脱钩甚至同向。判断当前处于体制 B 的依据：6 月与 7 月声明措辞、7 月纪要"收益率上行由实际利率贡献、 长期通胀补偿稳定"、ACM 分解显示期限溢价未上升。
evidence_indicators:
- indicator_id: dfii10
  expected_sign: up
  weight: high
  rationale: 体制 B 下的主锚；2026-09-02 为 2.45%，年内高点 2.47%（7 月 31 日）
- indicator_id: t10yie
  expected_sign: flat
  weight: high
  rationale: 盈亏平衡稳定（2.34%）说明市场相信联储，收益率上行是实际利率而非通胀补偿
- indicator_id: curve_2s30s
  expected_sign: down
  weight: medium
  rationale: 熊平（1 月 29 日 1.32 → 9 月 2 日 0.88）是"联储主动"而非"财政失控"的曲线形态
- indicator_id: gc_front
  expected_sign: down
  weight: high
  rationale: 金价与实际利率负相关的直接结果
- indicator_id: ff_cum_change_bp
  expected_sign: up
  weight: medium
  rationale: 联邦基金期货条上倾（ZQU26 3.70% → ZQU27 4.24%，相对 EFFR 3.63% 约 +60bp）表明市场为加息周期定价
