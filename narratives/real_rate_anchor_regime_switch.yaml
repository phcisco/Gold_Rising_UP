  note: 财政主导要求联储被动；两者在同一时点只能一个是主导叙事
- narrative_id: fed_independence_erosion
  note: 独立性受损是体制 B 转 A 的机制；该叙事升温即本叙事失效的前兆
- narrative_id: ycc_financial_repression
  note: 曲线控制意味着实际利率被人为压低，旧锚失效
- narrative_id: etf_western_investor_return
  note: 同上，反向引用
