counterargument: 实际收益率 2.45% 已是年内高位，若加息落地导致增长放缓，市场会迅速重新定价降息，实际利率回落；黄金 16% 的回撤可能主要是投机持仓与 GLD 的拥挤度释放， 而央行购金（簇二）对实际利率不敏感，会在低位承接。此外，以 CPI 3.4% 计算的事后实际政策利率仍只有约 0.3%，"紧缩"更多是预期而非现实。
