  note: 两者争夺“边际买家”身份；东方贴水 + 西方流入意味着定价权暂时回到西方
- narrative_id: cb_reserve_reallocation
  note: 同向但不同主体：人民银行购金强化国内投资信心，但不能替代批发需求
