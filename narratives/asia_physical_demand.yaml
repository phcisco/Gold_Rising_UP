counterargument: 东方需求是价格的函数而非驱动：2026 年上半年的进口与金条热发生在价格从 5,595 美元回落的阶段，属逢低买入；当价格重回 4,500 美元以上时上海与印度同时贴水， 说明东方是“地板”而非“天花板”，且金饰（278t，疫情以来最低季度）与批发出库持续走弱，东方对金价上行的贡献被高估。
