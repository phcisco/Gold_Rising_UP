id: asia_physical_demand
name: 亚洲实物需求与定价权东移
status: active
lifecycle_state: 退潮
lifecycle_since: 2026-06-30
lifecycle_rationale: 上半年的东方买盘极强（WGC：中国 H1 金条金币 314t 创纪录，中国净进口 H1 764t、同比 +138%，6 月 152t 为 2024 年 3 月以来最高；印度 H1 金条金币 113t 为 2013 年以来最强上半年）， 但 6 月以来动能明显退潮：上金所出库量 7 月 80t（同比 -15%），8 月月报显示出库量进一步降至 62.1t（环比 -22%）；上海金相对国际价小幅贴水（9 月 2 日约 -0.6% 至 -1.0%，方法学见备注）； 印度国内价格持续低于进口平价（8 月中折价约 45 美元/盎司，5 至 6 月曾达 100 美元）；亚洲 ETF 6 月创历史最大单月流出。 投资端（中国 ETF 8 月前 12 日 +8t、人民银行购金）仍强，但批发与金饰端在退潮，整体判定为“退潮”而非“主导”。
pricing_degree: 部分
pricing_rationale: 卖方与 WGC 已把“亚洲投资主导”写入展望（GDT Q2 展望：OTC 与亚洲买盘是下半年主要增量），但当前价格并未体现东方溢价——上海与印度同时贴水说明边际实物买家此刻不在东方； 市场为“东方地板”付了部分溢价（金价在无西方 ETF 买盘的上半年仍站稳 4,000 美元），但未为“东方追涨”付溢价。
direction: bull
horizon: 3-12m
thesis: 中国与印度的实物投资需求（金条金币、进口、本地 ETF）取代西方成为金价的结构性买家，但其力度在 2026 年下半年是否恢复取决于本地利率、股市与节日季，而非美国宏观。
logic_chain:
- 中国低利率、房地产疲弱、股市波动与增值税改革（投资品免税）把家庭储蓄推向金条金币与积存金
- 人民银行连续购金强化国内投资者对黄金的信心，形成官方与民间同向的买盘
- 印度节日季与婚庆需求叠加以旧换新，进口在价格回落后反弹（7 月进口额 41.6 亿美元，环比翻倍）
- 东方买盘在价格回落时进场（逢低买入），压低回撤深度；但在价格快速上涨时转为观望甚至卖旧金，抑制追涨
- 上海溢价与印度溢价是东方边际买家是否在场的即时读数：溢价为正说明金属向东流、支撑价格；贴水说明本地供给过剩
regime_dependency:
  passive_fed: bull
  credible_fed: mixed
  note: 东方需求主要由本地因素驱动（中国利率与房地产、印度节日与关税），与美国体制弱相关；但“联储可信”体制下美元走强会抬高人民币与卢比计价金价， 压制金饰消费并触发以旧换新供给，使实物端由买方转为卖方；投资端（ETF、金条）则更看本地股市与利率，方向不确定。
evidence_indicators:
- indicator_id: shanghai_premium
  expected_sign: up
  weight: high
  rationale: 上海金相对国际价溢价转正且持续，是东方边际买家回归最直接的证据；当前为小幅贴水
- indicator_id: sge_au9999
  expected_sign: up
  weight: medium
  rationale: 人民币金价突破 60 日均线（WGC 提及 8 月初约 920 元/克）有助于唤醒国内投资需求
- indicator_id: xau_cny
  expected_sign: up
  weight: low
  rationale: 人民币计价金价与美元金价的背离衡量本地需求独立性
- indicator_id: usdcny
  expected_sign: down
  weight: medium
  rationale: 人民币走强降低本地金价、利于国内买盘；人民币贬值则本地价格被动抬高、抑制消费
pricing_proxies:
- indicator_id: shanghai_premium
  note: 溢价本身就是定价读数：正溢价 = 东方在付价；贴水 = 东方缺席
- name: india_ncdex_discount
  url: https://www.gold.org/goldhub/gold-focus/2026/08/india-gold-market-update-recovery-taking-shape
  note: 印度国内价格相对进口平价的折价，WGC 月度引用 NCDEX 数据
- name: china_gold_etf_tonnes
