id: risk_on_bear_case
name: 看空叙事：风险偏好回升、信用利差收窄与 AI 生产率红利压制黄金
status: active
lifecycle_state: 退潮
lifecycle_since: 2026-08-03
lifecycle_rationale: 这条叙事在 2026 年 3 月至 7 月是主导：黄金自 1 月 29 日高点回撤 25%，Q2 全球黄金 ETF 净流出 45 吨、6 月单月流出 74 吨（WGC）， 北美年内仍为净流出；同期标普 500 年内 +12%（8 月 13 日创新高 7,799），VIX 15.2（10 年 35 分位、1 年 12 分位）， HYG/LQD 比值 0.751 为两年最高（信用利差收窄），10 年实际收益率 2.45%。Warsh 8 月 28 日称信用利差“接近历史区间低端”、 设备与无形资产投资四季度同比约 9%、标普利润增长超 20%。但 8 月黄金在这些条件全部维持的情况下反弹 10.9%， 叙事失去对价格的控制，故判为退潮；其宏观输入并未消失，是需要每日复核的张力。 两条支撑腿已被官方数据否定：财政修复——FY2026 前十个月赤字 1.799 万亿美元已超过 FY2025 全年 1.775 万亿（财政部 MTS，7 月）； AI 生产率红利——BLS 非农生产率 2026 年 Q1 0.8%、Q2 1.4%，远低于 2025 年 Q2 至 Q3 的 4.2% 与 5.2%。
pricing_degree: 部分
pricing_rationale: 看空押注已部分出清：CFTC 管理基金净多由 6 月初 105,863 手回升至 8 月 25 日 144,747 手（5 年 79 分位，高于 1 月高点时的 137,444 手）， 7 月全球 ETF 转为净流入 30 亿美元（欧洲主导）。但北美 ETF 年内仍净流出、Q2 投资需求（不含场外）同比 -46%， 说明部分美国机构仍按看空叙事配置。
direction: bear
horizon: 3-12m
thesis: 增长有韧性、信用宽松、股市新高与实际利率 2.4% 以上的组合抬高黄金机会成本并抽走避险需求；但其“财政修复”与“AI 生产率”两条腿在硬数据上不成立，真正起作用的只有实际利率与风险偏好。
logic_chain:
- AI 资本开支拉动投资与利润，增长预期上修
- 风险资产上涨、信用利差收窄、波动率走低，避险需求下降
- 联储因通胀高于目标维持或提高利率，实际收益率上行，黄金机会成本上升
- 若财政赤字收窄，主权信用溢价叙事失去依据，黄金失去另一根支柱
- 结果：ETF 流出、投机多头减仓、金价回落
regime_dependency:
  passive_fed: mixed
  credible_fed: bear
  note: 体制 B 是这条叙事的自然栖息地：实际利率上行与风险偏好回升叠加。体制 A 下风险偏好回升与货币贬值同时抬升股票与黄金 （2024 至 2025 年形态），叙事的机会成本腿失效，只剩“避险需求下降”一腿，方向不明。
