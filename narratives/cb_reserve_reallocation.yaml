id: cb_reserve_reallocation
name: 央行储备再配置与去美元化
status: active
lifecycle_state: 共识
lifecycle_since: 2026-06-16
lifecycle_rationale: WGC 2026 央行调查（76 家，2026-06-16 发布）：89% 预期全球央行金储备未来 12 个月上升，创纪录的 45% 预期本行增持，74% 预期美元在全球储备中占比五年内中度或显著下降； WGC GDT Q2 2026：央行净购 289t（二季度历史最高，Q1 下修后为 57t），H1 合计 345t；外汇局数据：人民银行 2026 年 7 月末黄金储备 7,608 万盎司（2,366t）， 7 月单月 +64 万盎司（19.9t），为 2023 年 10 月以来最大单月增量、连续第 21 个月增持，且 1 至 7 月逐月加速（+1.2/0.9/5.0/8.1/10.0/14.9/19.9t）。 叙事已被卖方、WGC 与央行自身普遍接受，属“共识”而非“主导”。
pricing_degree: 充分
pricing_rationale: 基线（年均约 1,000t 的官方购金）已写入所有主流供需预测（WGC 展望：2026 年“维持强劲但低于 2025”）；Q2 创二季度纪录的 289t 购金发生在金价下跌 8%（季均）的季度里， 说明持续购金本身不再推升价格，而是提供下方支撑。增量信息（人民银行逐月加速、未报告购买高企）只部分定价：Q1 初值从 244t 下修到 57t（-77%）而金价当季仍创新高， 显示市场对季度数字的边际反应弱。风险不对称：购金放缓对价格的伤害大于继续购金的推升。
direction: bull
horizon: years
thesis: 官方部门以约每年 1,000t 的价格不敏感买盘持续把黄金从私人部门转移到储备，构成金价的结构性地板，但这一地板已被市场充分预期。
logic_chain:
- 地缘碎片化与金融制裁使外汇储备的“主权负债属性”成为风险，黄金作为无对手方资产被重新评估
- 新兴市场央行（波兰、中国、乌兹别克、哈萨克、捷克、新加坡等）以本币国内购金或出售美元资产的方式增持
- 官方购金对价格不敏感且在价格回落时加速（Q2 2026 价跌买多），压缩金价左尾
- 私人部门可得的新增供给（矿产 + 回收约 1,270t/季）中约四分之一被官方吸收，供需边际收紧
- 黄金占全球储备比例上升主要来自估值效应，形成“储备再配置”叙事的自我强化，但也埋下 IMF 式反弹的种子
regime_dependency:
  passive_fed: bull
  credible_fed: bull
  note: 央行购金主要由地缘与储备治理动机驱动，对美国利率体制不敏感，方向在两种体制下不反转；但在“联储可信、实际利率高”的体制下， 部分以流动性为先的央行（土耳其 Q1 卖出 83t、俄罗斯年内净卖 44t）会成为卖方，购金净额下降、地板变薄。
evidence_indicators:
- indicator_id: cb_purchases
  expected_sign: up
  weight: high
  rationale: WGC 月度“央行黄金统计”与季度 GDT 的官方净购金；注意 IMF IFS 数据滞后两个月，季度初值有大幅修正风险（Q1 2026 从 244t 修至 57t）
- indicator_id: dxy
  expected_sign: down
  weight: medium
  rationale: 去美元化叙事若成立，美元储备份额下降应伴随美元趋势走弱；美元走强而央行仍买则说明购金是“非美元敞口对冲”而非美元崩溃预期
- indicator_id: usdcny
  expected_sign: flat
  weight: low
  rationale: 人民银行购金与人民币汇率稳定诉求并行；人民币若大幅贬值，购金往往放缓（外汇局需保留美元流动性）
pricing_proxies:
- indicator_id: cot_mm_net_pctl
  note: 投机盘拥挤度；若管理基金净多处于高分位而央行购金放缓，则地板叙事被过度依赖
- name: wgc_cb_survey_intent
  url: https://www.gold.org/goldhub/research/central-bank-gold-reserves-survey-2026
  note: 45% 本行增持意向为历史峰值，属情绪极值型代理（年度）
- name: pboc_monthly_addition
  url: https://www.safe.gov.cn/safe/2026/0205/27113.html
  note: 人民银行月度增量（万盎司）是最及时的官方购金高频代理，每月 7 日左右发布
