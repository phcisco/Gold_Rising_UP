tensions:
- narrative_id: imf_gold_reserve_caution
  note: IMF 主张黄金是高风险储备资产、国内购金计划应避免，与央行调查中 50% 受访者以本币国内购金直接冲突
- narrative_id: etf_western_investor_return
  note: 不冲突但存在替代关系：若西方 ETF 回归成为边际买家，央行地板的重要性下降；反之央行是唯一买家时价格上行缺乏弹性
