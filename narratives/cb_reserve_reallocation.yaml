- 外汇局 黄金储备 万盎司 月度
- IMF IFS official gold holdings unreported buying
- de-dollarization reserve diversification gold share
counterargument: IMF Note 2026/007 指出黄金储备占比上升“压倒性地”来自估值效应而非实物累积；H1 2026 央行净购金 345t 是 2022 年以来最弱上半年， 且 Q1 初值被下修 77%，说明“每年 1,000t”的基线并不牢靠；若金价维持在 4,000 美元以上，更多央行会像土耳其、俄罗斯一样把黄金当作流动性来源而卖出。
