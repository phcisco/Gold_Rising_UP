- de-dollarization reserves gold
counterargument: 美元不是黄金的驱动：DXY 处于 20 年 79 分位，250 日贝塔只解释 13% 的黄金方差；1 月高点后黄金下跌 25% 期间 DXY 仅升 4%。 黄金的边际买家是亚洲场外与欧洲 ETF（WGC Q2 与 7 月报告），其行为由本币金价与本地实际利率决定，而非美元指数。 反过来说，若联储转向被动，美元贬值与黄金上涨将同源出现，此时这条叙事会重新变成主导——但那是簇一叙事的结果，不是原因。
