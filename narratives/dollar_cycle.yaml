id: dollar_cycle
name: 美元周期：金价上涨是美元走弱的伴随，还是黄金的独立定价
status: active
lifecycle_state: 边际
lifecycle_since: 2026-01-27
lifecycle_rationale: 美元指数 2026 年 1 月 27 日触及两年低点 96.22，恰在黄金 1 月 29 日创历史高点前两日；此后美元回升至 99 至 101 区间， 黄金却先跌 25% 再于 8 月反弹 11%，两者脱钩。截至 2026-09-03：DXY 99.38，年初至今 +1.1%（20 年 79 分位）； 黄金以美元计 +3.5%，以欧元计 +4.8%，以日元计 +4.1%，以人民币计 -0.7%（人民币在岸年内升值 4.0% 至 6.7173，两年最强）。 黄金对 DXY 的 250 日贝塔为 -2.0，R 方仅 0.13，即美元只解释黄金日度波动的 13%。 美元走弱当前不是金价的原因，最多是伴随变量，故为边际叙事。
pricing_degree: 部分
pricing_rationale: 年初至今黄金 +3.5% 而 DXY +1.1%，按贝塔应为 -2.2%，即约 5.7 个百分点的涨幅是黄金自身定价；7 月 31 日以来黄金 +10.6%， DXY -0.45%，贝塔隐含仅 +0.9%，约 9.7 个百分点为黄金自身。多币种金价同向变动（WGC 7 月表：年初至 7 月 31 日美元 -7.8%、 欧元 -5.9%、日元 -6.0%、人民币 -9.0%、卢比 +7.3%），说明是“黄金强弱”而非“美元强弱”。 市场并未把“弱美元”作为黄金多头的主逻辑下注：DXY 处于 20 年高位区，联储加息预期支撑利差。
direction: mixed
horizon: 3-12m
thesis: 多币种计价金价能区分“黄金强”与“美元弱”；2026 年的金价变动几乎全部是黄金自身定价，美元走弱叙事目前不成立。
logic_chain:
- 传统链条：美元走弱降低非美买家的黄金价格、削弱美元资产吸引力，黄金上涨
- 检验方法：若金价以欧元、日元、人民币计价同向同幅变动，则为黄金自身定价；若仅美元金价变动，则为美元现象
- 2026 年实证：DXY 年内小幅走强，黄金在美元、欧元、日元计价下均上涨、人民币计价持平，属于黄金自身定价
- 体制含义：联储可信并加息时利差支撑美元，美元叙事对黄金为空；联储被动时美元贬值与黄金上涨同源，叙事为多
regime_dependency:
  passive_fed: bull
  credible_fed: bear
  note: 体制 A 下“美元贬值”与“黄金上涨”是同一件事（对美元信用的重新定价），叙事成立且为多； 体制 B 下利差支撑美元，黄金若上涨必须是自身定价，美元叙事为空但可能被黄金自身因素压过——这正是 2026 年 8 月的形态。
evidence_indicators:
- indicator_id: dxy
  expected_sign: down
  weight: high
  rationale: 叙事的定义变量；当前 99.38 年内 +1.1%，与叙事相反
- indicator_id: xau_eur
  expected_sign: up
  weight: high
  rationale: 欧元金价与美元金价同向上涨说明是黄金自身定价
- indicator_id: xau_jpy
  expected_sign: up
  weight: medium
  rationale: 同上，日元口径
- indicator_id: xau_cny
  expected_sign: up
  weight: high
  rationale: 人民币升值使人民币金价年内持平，东方买家未获收益；人民币金价重新上行是黄金自身强势的确认
- indicator_id: usdcny
  expected_sign: down
  weight: medium
  rationale: 人民币走强既压低人民币金价也反映美元周期转弱
- indicator_id: eurusd
  expected_sign: up
  weight: low
  rationale: 欧元为 DXY 最大权重成分
pricing_proxies:
