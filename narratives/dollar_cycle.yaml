tensions:
- narrative_id: energy_stagflation
  note: 油价冲击在体制 B 下同时推高美元与实际利率，压制黄金；两者共振时美元叙事为空
- narrative_id: risk_on_bear_case
  note: 风险偏好回升通常伴随美元走弱，却也伴随黄金资金流出，方向相互抵消
news_queries:
