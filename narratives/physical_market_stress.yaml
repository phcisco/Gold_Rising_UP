id: physical_market_stress
name: 实物市场紧张（金库、EFP、租赁利率）
status: active
lifecycle_state: 退潮
lifecycle_since: 2026-03-31
lifecycle_rationale: LBMA 官方金库数据：伦敦金库黄金 2026 年 7 月末 9,534t（+0.74% 环比），自 2025 年 12 月 9,106t 起连续 7 个月上升，较 2025 年 2 月低点 8,477t 增加 12.5%，金属在流入伦敦而非被抽离； 上金所场内黄金同业租借参考费率：8 月 24 至 28 日周 6 个月 0.20%、1 年 0.27%（加权），低于 7 月 6 至 10 日的 0.30%/0.26%，处于极低水平，无实物借贷紧张迹象； 上海金相对国际价小幅贴水，印度折价约 45 美元/盎司。2024 至 2025 年关税抢运造成的 COMEX 库存堆积与 EFP 异常已成过去（旧报告称 COMEX 库存自 1 月峰值回落 26.5%，本轮未能核实）。 “实物紧张/挤兑”叙事当前处于退潮。
pricing_degree: 已出清
pricing_rationale: 实物紧张溢价已从价格中出清：伦敦金库连续增库、租赁费率贴近零、东方双贴水，三者共同说明实物市场供给充裕；市场对 EFP 或租赁利率飙升没有任何定价。 这意味着该叙事若重现将是“从零起步”的新信息，短期弹性大，但当前无仓位。
direction: bull
horizon: weeks
thesis: 实物市场结构指标（伦敦金库、租赁利率、地区溢价、EFP）当前一致显示供给充裕、无紧张；本卡的作用是监控该状态的逆转，逆转时对金价为短期强多。
logic_chain:
- 实物紧张的三个可观察症状：金库存量下降、租赁利率飙升（借金成本上升）、地区溢价与 EFP 走阔
- 当前三者均处于反向：伦敦增库、上金所租借费率 0.2 至 0.3%、上海与印度贴水
- 紧张若重现，通常源于央行或亚洲实物买盘在短期内抽走可交割金属，或美国关税/制裁预期引发跨市场搬运
- 紧张状态下期货相对现货升水收窄甚至倒挂、GLD 折溢价异常，是数周尺度的强多信号
regime_dependency:
  passive_fed: bull
  credible_fed: bull
  note: 方向不反转，但发生概率不同：联储被动、财政主导与制裁扩张的体制下，主权对实物的争夺更可能触发紧张； 联储可信体制下实物需求低迷，紧张状态难以出现，本卡多为“无信号”。
evidence_indicators:
- indicator_id: shanghai_premium
  expected_sign: up
  weight: high
  rationale: 上海溢价走阔至 1% 以上是亚洲抽金的首要读数
- indicator_id: gc_term_spread
  expected_sign: down
  weight: medium
  rationale: 近月对次月价差收窄或倒挂反映即期实物紧张（借金成本上升）
- indicator_id: gld_tonnes
  expected_sign: down
  weight: low
  rationale: 紧张时 GLD 常被用作实物来源而遭赎回（金属被拿走）；需与价格结合判读
pricing_proxies:
- name: sge_lease_rate_1y
  url: https://www.sge.com.cn/sjzx/hjzjckll
  note: 上金所每周发布的场内黄金同业租借参考费率（当前 1 年 0.27%），免费官方，是唯一可自动抓取的租赁利率
- name: lbma_vault_gold_tonnes
  url: https://cdn.lbma.org.uk/downloads/LBMA-London-Vault-Holdings-Data-July-2026.xlsx
  note: LBMA 月度金库存量 xlsx（免费），7 月 9,534t
verification_signals:
- id: v1
  description: 上金所 1 年期黄金租借加权费率单周升至 1.0% 以上（约当前 4 倍）
  type: quant
  rule:
    indicator_id: sge_lease_rate_1y
    op: gt
    value: 1.0
  next_check: 2026-09-14
- id: v2
  description: LBMA 8 月金库数据（约 10 月初发布）出现环比下降超过 1%
  type: quant
  rule:
    indicator_id: lbma_vault_gold_tonnes
    op: change_lt
    value: -1
    window_days: 45
  next_check: 2026-10-05
- id: v3
  description: 上海溢价 5 个交易日均值走阔至 +1% 以上且印度折价转为溢价
  type: quant
  rule:
    indicator_id: shanghai_premium
    op: gt
    value: 1.0
    window_days: 7
  next_check: 2026-09-30
falsification_conditions:
- id: f1
  version: 1
  created: 2026-09-03
  description: 至 2026-12-31，上金所 1 年期租借费率始终低于 0.6%，LBMA 金库逐月不降，上海溢价月均为负——“紧张重现”在本年度内未发生（本卡维持退潮并转归档）
  type: quant
  rule:
    all_of:
    - indicator_id: sge_lease_rate_1y
      op: lt
      value: 0.6
      window_days: 120
    - indicator_id: shanghai_premium
      op: lt
      value: 0
      window_days: 92
  deadline: 2026-12-31
tensions:
- narrative_id: asia_physical_demand
  note: 同源：亚洲实物需求恢复是实物紧张的最可能触发器；东方贴水则两卡同时无信号
- narrative_id: cb_reserve_reallocation
  note: 央行集中提取实物（如自英格兰银行回运本土，2026 调查中 9% 已增加本土存储）可触发伦敦金库下降
news_queries:
- gold lease rate spike London bullion
- COMEX gold inventories registered eligible
- EFP gold exchange for physical premium
- London vault gold holdings LBMA monthly
- gold repatriation central bank Bank of England vault
counterargument: 实物紧张在 2024 至 2025 年主要由美国关税抢运造成，是政策噱头而非结构性短缺；伦敦金库连续增库与近零租赁费率说明当前金属过剩， 监控该叙事的价值在于其低概率高弹性，而非当下有信号。
