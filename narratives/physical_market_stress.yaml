proposed_indicators:
- id: shanghai_premium
  name: 上海金对国际价溢价（%，上金所 Au99.99 收盘 vs 国际价折人民币/克）
  source: 派生：上金所每日行情 Au99.99 与 LBMA PM（由 GLD NAV 反推）或 Yahoo GC=F，经 USDCNY 折算
  url: https://www.sge.com.cn/sjzx/quotation_daily_new
  frequency: daily
  lag: 1 个交易日
  tier: 1
  rationale: schema 种子表列有此 id 但 registry 尚未登记，故在卡内声明；两种国际价基准相差约 0.4 个百分点且有 7.5 小时时点差，落地时需固定方法并标注误差
- id: sge_lease_rate_1y
  name: 上金所场内黄金同业租借参考费率（1 年加权，%）
  source: 上海黄金交易所 黄金租借参考费率 周度 PDF
  url: https://www.sge.com.cn/sjzx/hjzjckll
  frequency: weekly
  lag: 1 至 3 天（周初发布上周）
  tier: 2
  rationale: 伦敦无免费租赁利率（GOFO 已于 2015 年停发）；上金所费率是唯一免费官方替代
- id: lbma_vault_gold_tonnes
  name: 伦敦金库黄金存量（吨，月末）
  source: LBMA London Vault Holdings xlsx
  url: https://www.lbma.org.uk/prices-and-data/london-vault-data
  frequency: monthly
  lag: 约 1 个月（文件名随月份变化，需按页面链接发现）
  tier: 2
  rationale: 免费官方；本轮已下载并核实 2016 年 7 月以来完整序列
- id: comex_gold_stocks
  name: COMEX 黄金库存（注册 + 合格，盎司）
  source: CME Group Metals Depository Statistics（Gold_Stocks.xls）
  url: https://www.cmegroup.com/delivery_reports/Gold_Stocks.xls
  frequency: daily
  lag: 1 个交易日
  tier: 3
  rationale: 本机 IP 被 CME 以“疑似抓取”封禁（403 JSON），CME 公开 FTP 的 delivery_reports 目录不含金属；暂无免费自动化来源，只能人工浏览器查看
- id: gold_efp
  name: COMEX 黄金 EFP（期货对伦敦现货价差）
  source: 无免费官方来源（CME DataMine 与经纪商报价为付费）
  url: https://www.cmegroup.com/
  frequency: daily
  lag: 无
  tier: 3
  rationale: 核实结论：“无免费源”成立；可用 gc_term_spread 与 GLD 折溢价作为间接代理
