counterargument: Note 明言不代表 IMF 执董会观点，且主要针对非货币黄金的国内购金治理风险；它同时承认黄金无信用风险、可对冲制裁与美元贬值、在长久期组合中有最优配置比例。 2022 年以来的购金动机是地缘与制裁风险而非收益优化，IMF 的 VaR 流动性框架不改变这一动机；最大买家中国、波兰不依赖 IMF 项目。
