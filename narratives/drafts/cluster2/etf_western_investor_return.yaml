proposed_indicators:
  - id: wgc_global_etf_tonnes
    name: 全球黄金 ETF 持仓吨数与分地区月度流量
    source: WGC Gold ETF flows 月度评论（文本免登录；xlsx 需免费注册）
    url: https://www.gold.org/goldhub/research/gold-etfs-holdings-and-flows
    frequency: monthly
    lag: 约 6 天（次月 6 日前后）
    tier: 2
    rationale: 补足 GLD 之外的欧洲与亚洲流向；北美由负转正是关键读数
  - id: lbma_pm_implied
    name: 由 GLD NAV 反推的 LBMA 下午定盘价（NAV/份 ÷ 每份含金盎司）
    source: SPDR 历史档案
    url: https://api.spdrgoldshares.com/api/v1/historical-archive?product=gld&exchange=NYSE&lang=en
    frequency: daily
    lag: 1 个交易日
    tier: 1
    rationale: SPDR 档案已按 ICE 要求删除 LBMA 价格列，registry 中 lbma_pm 的来源说明需改为此反推法（2026-09-02 反推值 4,382.2 美元/盎司；英国假日沿用前值）
