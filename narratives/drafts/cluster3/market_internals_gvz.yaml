  - gold silver ratio
  - gold miners GDX outperform gold
  - COMEX gold open interest managed money
  - platinum palladium price collapse
counterargument: >-
  比值极值有一半来自分母：VIX 处于 1 年 12 分位，是股票波动率异常低而非黄金波动率异常高；GVZ 26 只比 2026 年 1 至 7 月的
  均值 25 至 36 更低，是 1 月吹泡后波动率均值回归尚未完成的余波。事件研究显示比值极值没有一致方向，把它当作卖出或买入信号都会出错，
  它只应改变仓位规模。此外 CFTC 净多 79 分位远未到 2016 年 273,076 手的历史极值。
