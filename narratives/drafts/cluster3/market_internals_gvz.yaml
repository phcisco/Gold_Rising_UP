    url: https://cdn.cboe.com/api/global/us_indices/daily_prices/GVZ_History.csv
    note: GVZ 减 20 日已实现波动率，当前约 +3 个波动点
verification_signals:
  - id: v1
    description: GVZ/VIX 比 30 日内回落至 1.3 以下且黄金高于 4,500（自身波动率体制以上行方式解除）
    type: quant
    rule:
      all_of:
        - {indicator_id: gvz_vix_ratio, op: lt, value: 1.3}
        - {indicator_id: gc_front, op: gt, value: 4500}
    next_check: 2026-10-02
  - id: v2
    description: 金银比升破 75（防御性轮动加深，2013 年形态）
    type: quant
    rule: {indicator_id: gold_silver_ratio, op: gt, value: 75}
    next_check: 2026-09-30
  - id: v3
    description: GDX/GLD 比升破 0.25 并维持 10 个交易日（矿业股确认）
    type: quant
    rule: {indicator_id: gdx_gld_ratio, op: gt, value: 0.25}
    next_check: 2026-09-30
  - id: v4
    description: CFTC 管理基金净多分位升破 90（拥挤）
    type: quant
    rule: {indicator_id: cot_mm_net_pctl, op: gt, value: 90}
    next_check: 2026-09-30
  - id: v5
    description: GVZ 减 20 日已实现波动率超过 8 个波动点（期权市场为事件定价，通常先于大幅波动；proposed 指标 gvz_realized_spread）
    type: quant
    rule: {indicator_id: gvz_realized_spread, op: gt, value: 8}
    next_check: 2026-09-30
falsification_conditions:
  - id: f1
    version: 1
    created: 2026-09-03
    description: 到 2026-10-31，GVZ 低于 20 且 GVZ/VIX 比低于 1.2——自身波动率体制结束，卡片归档
    type: quant
    rule:
      all_of:
        - {indicator_id: gvz, op: lt, value: 20}
        - {indicator_id: gvz_vix_ratio, op: lt, value: 1.2}
    deadline: 2026-10-31
  - id: f2
    version: 1
    created: 2026-09-03
    description: VIX 升破 25 而 GVZ 不升——黄金波动率转为宏观驱动，“自身波动率体制”的判断失效
    type: quant
    rule:
      all_of:
        - {indicator_id: vix, op: gt, value: 25}
        - {indicator_id: gvz, op: lt, value: 28}
    deadline: 2026-12-31
tensions:
  - narrative_id: risk_on_bear_case
    note: 矿业股领涨依赖股市风险偏好；若风险偏好逆转，GDX 贝塔将放大黄金下行
  - narrative_id: dollar_cycle
    note: 黄金自身定价与美元无关的判断在两卡中一致，无冲突，列出以便交叉验证
news_queries:
