id: tariff_inflation
name: 关税通胀：关税推升美国通胀并抬高黄金的通胀对冲需求
status: archived
lifecycle_state: 归档
lifecycle_since: 2026-09-03
lifecycle_rationale: >-
  官方数据显示关税的通胀冲击既小又在消退：BLS 核心商品 CPI 同比在 2025 年 12 月见顶于 1.41%，2026 年 7 月回落至 0.78%，
  新车价格同比 0.54%；2026 年的通胀上行全部来自能源（能源分项 +14.7%），联储 6 月 SEP 上修通胀预测与 7 月声明都把原因归于
  “包括能源在内的供给冲击”，Warsh 8 月 28 日讲话全篇未提关税。关税收入本身也在收缩：财政部 MTS 关税月收入由 2025 年 10 月峰值
  331 亿美元降至 2026 年 7 月 248 亿美元（FY2026 前十个月累计 2,692 亿美元，仍比上年同期 1,417 亿高 90%）。
  最高法院 2026 年 1 月 26 日判决 Learning Resources, Inc. v. Trump（No. 24-1287，607 U.S. 229）；本次未能取回判决全文，
  但判决后关税月收入的台阶式下降与之时间吻合。作为黄金叙事它已失去证据支撑，归档而非“已证伪”，因为关税并未消失、仍可能以其他法律依据重启。
pricing_degree: 已出清
pricing_rationale: >-
  10 年盈亏平衡 2.34%，与 2025 年关税宣布前后水平相当，市场不再为关税通胀定价；黄金 2025 年 4 月的关税恐慌溢价早已被
  更大的能源与联储因素覆盖。
direction: mixed
horizon: 3-12m
thesis: 关税会通过进口商品价格推升核心通胀并强化黄金的通胀对冲需求——2026 年核心商品通胀不到 1% 且回落，叙事在数据上失效。
logic_chain:
  - 关税抬高进口商品成本，传导至核心商品 CPI
  - 通胀预期上行，黄金作为通胀对冲获得配置
  - 实证：核心商品 CPI 峰值仅 1.41%，2026 年 7 月 0.78%；进口价格（税前）上涨源自美元与外国通胀而非关税
  - 联储与市场都把通胀归因于能源；关税收入自 2026 年初回落
  - 结论：机制的第一环（传导）幅度太小，叙事对黄金无边际信息
regime_dependency:
  passive_fed: bull
  credible_fed: bear
  note: >-
    若关税真的推高核心通胀，体制 A 下黄金受益于通胀预期上行，体制 B 下联储加息使实际利率上升而黄金承压——与能源滞胀叙事同构。
    但传导幅度不足使两种体制下的效应都可忽略。
evidence_indicators:
  - indicator_id: t10yie
    expected_sign: up
    weight: medium
    rationale: 关税通胀若被定价应体现为盈亏平衡上行
  - indicator_id: dxy
    expected_sign: up
    weight: low
    rationale: 关税历史上推升美元，对黄金形成反向力
pricing_proxies:
