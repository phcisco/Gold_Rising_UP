    next_check: 2026-10-14
  - id: v2
    description: 重新激活条件：关税月收入重回 300 亿美元以上（新一轮广泛关税生效；proposed 指标 customs_duties_monthly，单位美元）
    type: quant
    rule: {indicator_id: customs_duties_monthly, op: gt, value: 30000000000}
    next_check: 2026-10-15
  - id: v3
    description: 重新激活条件：FOMC 声明或 SEP 把通胀上行明确归因于关税
    type: qual
    next_check: 2026-09-16
falsification_conditions:
  - id: f1
    version: 1
    created: 2026-09-03
    description: 已命中：自 2025 年关税实施以来核心商品 CPI 同比从未超过 2.0%（峰值 1.41%，2025-12），且 2026 年 7 月回落至 0.78%——传导幅度不足以构成黄金叙事
    type: qual
    deadline: 2026-09-03
tensions:
  - narrative_id: energy_stagflation
    note: 同一“供给侧通胀”框架，但 2026 年的通胀全部来自能源；把关税与能源混为一谈会误判联储反应
news_queries:
  - tariff inflation core goods CPI pass-through
  - Supreme Court IEEPA tariffs Learning Resources refund
  - Section 232 tariffs 2026
  - customs duties receipts Monthly Treasury Statement
counterargument: >-
  关税并非没有效果：核心商品通胀从 2024 年的约零升至 1.4%，关税年收入约 3,000 亿美元相当于一次财政紧缩，且行业关税（232 条款等）仍在；
  若政府以其他授权重启广泛关税，或者进口价格（不含燃料，7 月同比 +4.46%）持续走高并与关税叠加，核心商品通胀可能再起。
  但这仍是二阶因素，远小于能源与联储路径。
