    note: 关税实际征收规模，2026 年 7 月 248 亿美元，峰值 2025 年 10 月 331 亿
  - name: core_goods_cpi_yoy
    url: https://api.bls.gov/publicAPI/v1/timeseries/data/CUSR0000SACL1E
    note: 传导的直接度量，2026 年 7 月 0.78%
