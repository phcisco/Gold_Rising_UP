counterargument: 期货条定价约 2.4 次加息，而 6 月 SEP 中位数只隐含 1 次、Desk 调查中位数为零；委员会九位多数在 7 月选择等待，Warsh 强调"承诺一种纪律而非一项决定"。 若联储 9 月按兵不动，短端将大幅重定价，金价获得反弹；即使加息，"买预期卖事实"也可能出现。此外 CPI 6–7 月环比已转负或接近零（-0.35%、-0.01%，NSA）， 通胀动能减弱削弱加息必要性。
